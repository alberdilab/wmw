# wmw configuration
# Edit this file with: wmw config --edit

# --- Airtable ---
# Token: use $AIRTABLE_TOKEN env var or --airtable-token flag (not stored in config)
WMW_BASE: "appHz4Vc5NpVdfU3K"   # Airtable base ID, e.g. appXXXXXXXXXXXXXX
STUDIES_TABLE: "Studies"        # Table name for study-level records
SAMPLES_TABLE: "Samples"        # Table name for run/sample-level records

# --- Studies table column IDs ---
# Airtable field IDs (fldXXXXXXXXXXXXXX) for each column in the Studies table.
# Leave blank to use field names instead.
STUDIES_COL_STUDY_ACCESSION: ""
STUDIES_COL_SECONDARY_STUDY_ACCESSION: ""
STUDIES_COL_STUDY_TITLE: ""
STUDIES_COL_STUDY_DESCRIPTION: ""
STUDIES_COL_SOURCE: ""
STUDIES_COL_SCIENTIFIC_NAME: ""
STUDIES_COL_TAX_ID: ""
STUDIES_COL_FIRST_PUBLIC: ""
STUDIES_COL_CENTER_NAME: ""
STUDIES_COL_STATUS: ""
STUDIES_COL_PUBMED_ID: ""
STUDIES_COL_PUB_DOI: ""
STUDIES_COL_PUB_URL: ""
STUDIES_COL_PUB_TITLE: ""
STUDIES_COL_PUB_YEAR: ""
STUDIES_COL_PUB_JOURNAL: ""
STUDIES_COL_PUB_AUTHORS: ""

# --- Samples table column IDs ---
# Airtable field IDs (fldXXXXXXXXXXXXXX) for each column in the Samples table.
# Leave blank to use field names instead.
SAMPLES_COL_RUN_ACCESSION: ""
SAMPLES_COL_STUDY_ACCESSION: ""
SAMPLES_COL_SAMPLE_ACCESSION: ""
SAMPLES_COL_EXPERIMENT_ACCESSION: ""
SAMPLES_COL_SCIENTIFIC_NAME: ""
SAMPLES_COL_TAX_ID: ""
SAMPLES_COL_INSTRUMENT_PLATFORM: ""
SAMPLES_COL_INSTRUMENT_MODEL: ""
SAMPLES_COL_LIBRARY_STRATEGY: ""
SAMPLES_COL_LIBRARY_SOURCE: ""
SAMPLES_COL_LIBRARY_LAYOUT: ""
SAMPLES_COL_BASE_COUNT: ""
SAMPLES_COL_READ_COUNT: ""
SAMPLES_COL_FASTQ_FTP: ""
SAMPLES_COL_FASTQ_MD5: ""
SAMPLES_COL_FASTQ_URL_1: ""
SAMPLES_COL_FASTQ_URL_2: ""
SAMPLES_COL_COLLECTION_DATE: ""
SAMPLES_COL_FIRST_PUBLIC: ""
SAMPLES_COL_GEO_LOC_NAME: ""
SAMPLES_COL_HOST: ""
SAMPLES_COL_HOST_TAX_ID: ""
SAMPLES_COL_HOST_SCIENTIFIC_NAME: ""
SAMPLES_COL_COUNTRY: ""
SAMPLES_COL_CENTER_NAME: ""
SAMPLES_COL_SOURCE: ""
SAMPLES_COL_STATUS: ""

# --- Drakkar ---
DRAKKAR_CONDA_ENV: "/projects/alberdilab/data/environments/conda/drakkar" # Conda env name or path containing drakkar; leave blank to use $PATH
DRAKKAR_OUTPUT_DIR: "/projects/alberdilab/data/wmw"                       # Root output directory for drakkar runs

# --- NCBI / ENA ---
NCBI_EMAIL: ""              # Required by NCBI Entrez (any valid email)
NCBI_API_KEY: ""            # Optional NCBI API key for higher rate limits

# --- Scan defaults ---
# These are used when the corresponding CLI flag is not provided.
LIBRARY_SOURCE: ""          # e.g. METAGENOMIC — leave blank for no filter
INSTRUMENT_PLATFORM: ""     # e.g. ILLUMINA — leave blank for no filter
MIN_BASES: ""               # Minimum base count, e.g. 1000000000 — leave blank for no filter
DATE_FIELD: "first_public"  # ENA date field to filter on: first_public | collection_date | last_updated

# --- Host taxon exclusions ---
# Runs/studies whose host_tax_id matches any entry below are removed from scan results.
# Taxon IDs are NCBI taxonomy IDs (strings). Comment out any line to re-enable that group.
# Override at runtime with: wmw scan --exclude-taxa 9913,9823  (appended to this list)
#                           wmw scan --no-exclude              (disables all exclusions)
EXCLUDED_HOST_TAX_IDS:
  # Human
  - "9606"    # Homo sapiens

  # Livestock / farm animals
  - "9913"    # Bos taurus (cattle)
  - "9823"    # Sus scrofa (pig)
  - "9940"    # Ovis aries (sheep)
  - "9925"    # Capra hircus (goat)
  - "9796"    # Equus caballus (horse)
  - "89462"   # Bubalus bubalis (water buffalo)
  - "9838"    # Camelus dromedarius (dromedary camel)
  - "30521"   # Lama glama (llama)
  - "30538"   # Vicugna pacos (alpaca)

  # Poultry
  - "9031"    # Gallus gallus (chicken)
  - "9103"    # Meleagris gallopavo (turkey)
  - "8839"    # Anas platyrhynchos (duck)

  # Aquaculture
  - "8030"    # Salmo salar (Atlantic salmon)
  - "8022"    # Oncorhynchus mykiss (rainbow trout)
  - "8128"    # Oreochromis niloticus (Nile tilapia)
  - "7962"    # Cyprinus carpio (common carp)
  - "7110"    # Dicentrarchus labrax (European sea bass)
  - "8175"    # Sparus aurata (gilthead sea bream)

  # Laboratory animals
  - "10090"   # Mus musculus (mouse)
  - "10116"   # Rattus norvegicus (rat)
  - "9986"    # Oryctolagus cuniculus (rabbit)
  - "10141"   # Cavia porcellus (guinea pig)
  - "10036"   # Mesocricetus auratus (golden hamster)
  - "10053"   # Meriones unguiculatus (Mongolian gerbil)
  - "9544"    # Macaca mulatta (rhesus macaque)
  - "9541"    # Macaca fascicularis (crab-eating macaque)
  - "7955"    # Danio rerio (zebrafish)
