# --- Drakkar ---
DRAKKAR_CONDA_ENV: "/projects/alberdilab/data/environments/conda/drakkar" # Conda env name or path containing drakkar; leave blank to use $PATH
DRAKKAR_OUTPUT_DIR: "/projects/alberdilab/data/wmw"                       # Root output directory for drakkar runs

# --- NCBI / ENA ---
NCBI_EMAIL: ""              # Required by NCBI Entrez (any valid email)
NCBI_API_KEY: ""            # Optional NCBI API key for higher rate limits

# --- Scan defaults ---
# These are used when the corresponding CLI flag is not provided.
LIBRARY_STRATEGY: "WGS,METAGENOMIC"  # Comma-separated strategies; excludes amplicon data
LIBRARY_SOURCE: "METAGENOMIC"        # Comma-separated sources; excludes animal genomic libraries
INSTRUMENT_PLATFORM: ""     # e.g. ILLUMINA — leave blank for no filter
MIN_BASES: ""               # Minimum base count, e.g. 1000000000 — leave blank for no filter
DATE_FIELD: "first_public"  # ENA date field to filter on: first_public | collection_date | last_updated
SCAN_KEYWORDS: "ECOLOG|EVOLUT|WILD"  # | -separated keywords matched against study title and description; --keyword overrides

# --- Host taxon exclusions ---
# Studies/runs whose tax_id (scan) or host_tax_id (fetch) matches any entry below are excluded.
# Taxon IDs are NCBI taxonomy IDs (strings). Organised by named group.
# Override at runtime with: wmw scan --include Human        (re-enable one group)
#                           wmw scan --include Human,Livestock (re-enable multiple groups)
#                           wmw scan --include All           (disable all exclusions)
# Recognised group names: Human, Livestock, Aquaculture, Laboratory
EXCLUDED_HOST_TAX_IDS:
  Human:
    - "9606"    # Homo sapiens

  Livestock:
    - "9913"    # Bos taurus (cattle)
    - "9823"    # Sus scrofa (pig)
    - "9940"    # Ovis aries (sheep)
    - "9925"    # Capra hircus (goat)
    - "9796"    # Equus caballus (horse)
    - "89462"   # Bubalus bubalis (water buffalo)
    - "9838"    # Camelus dromedarius (dromedary camel)
    - "30521"   # Lama glama (llama)
    - "30538"   # Vicugna pacos (alpaca)
    - "9031"    # Gallus gallus (chicken)
    - "9103"    # Meleagris gallopavo (turkey)
    - "8839"    # Anas platyrhynchos (duck)

  Aquaculture:
    - "8030"    # Salmo salar (Atlantic salmon)
    - "8022"    # Oncorhynchus mykiss (rainbow trout)
    - "8128"    # Oreochromis niloticus (Nile tilapia)
    - "7962"    # Cyprinus carpio (common carp)
    - "7110"    # Dicentrarchus labrax (European sea bass)
    - "8175"    # Sparus aurata (gilthead sea bream)

  Laboratory:
    - "10090"   # Mus musculus (mouse)
    - "10116"   # Rattus norvegicus (rat)
    - "9986"    # Oryctolagus cuniculus (rabbit)
    - "10141"   # Cavia porcellus (guinea pig)
    - "10036"   # Mesocricetus auratus (golden hamster)
    - "10053"   # Meriones unguiculatus (Mongolian gerbil)
    - "9544"    # Macaca mulatta (rhesus macaque)
    - "9541"    # Macaca fascicularis (crab-eating macaque)
    - "7955"    # Danio rerio (zebrafish)
